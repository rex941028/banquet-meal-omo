name: 功能需求
description: 提出新功能或改善現有流程。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用者與問題
      description: 哪一類使用者，在什麼情境遇到什麼問題？
      placeholder: 身為……，我想要……，以便……。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望的功能與範圍
      description: 描述操作流程與預期行為，並註明本次不包含的項目。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 驗收條件
      description: 列出可檢查的完成條件，包含正常操作與例外情境。
      placeholder: |
        - [ ] 當……時，系統會……
        - [ ] 若……失敗，顯示……
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 主要影響範圍
      options:
        - 商品／購物車／結帳／付款
        - 會員／登入／點數
        - 喜宴 QR／門市自取／POS
        - 後台管理
        - 協作流程／文件
        - 其他
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 參考資料與相依項目
      description: 可附 PRD 的 User Story 編號、畫面草圖、相關 Issue，或需要小組決定的事項。
